# Archivo independiente: no combinar con docker-compose.yml ni con el override OCR local.
name: grafia-demo
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend: &backend
  build: ./BackEnd
  environment: &backend-env
    # Base de datos en Cloud SQL para SQL Server (IP privada). deploy/cargar-sql.sh
    # copia DB_SERVER y DB_PASSWORD del secreto grafia-sql de Secret Manager.
    DB_DRIVER: "{ODBC Driver 18 for SQL Server}"
    DB_SERVER: ${DB_SERVER:?Define DB_SERVER (IP privada de Cloud SQL)}
    DB_NAME: TT
    DB_USER: ${DB_USER:-sqlserver}
    DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY}
    CORS_ORIGINS: https://${APP_DOMAIN:?Define APP_DOMAIN}
    GOOGLE_VISION_ENABLED: ${GOOGLE_VISION_ENABLED:-true}
    GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Define GOOGLE_CLOUD_PROJECT}
    GOOGLE_VISION_LANGUAGE_HINTS: ${GOOGLE_VISION_LANGUAGE_HINTS:-}
    # Cuenta de Gmail que manda los códigos (deploy/cargar-correo.sh la copia de Secret Manager).
    CORREO_MODO: smtp
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  logging: *logs

services:
  # Crea TT si no existe y aplica las migraciones pendientes antes de arrancar el backend.
  db-init:
    <<: *backend
    command: [python, BD/inicializar_demo.py]
    environment:
      <<: *backend-env
      SEED_DEMO: "true"

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./FrontEnd
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *logs

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging: *logs

volumes:
  caddy_data:
  caddy_config:

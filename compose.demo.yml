# Archivo independiente: no combinar con docker-compose.yml ni con el override OCR local.
name: grafia-demo
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend: &backend
  build: ./BackEnd
  environment: &backend-env
    DB_DRIVER: "{ODBC Driver 18 for SQL Server}"
    DB_SERVER: database
    DB_NAME: TT
    DB_USER: sa
    DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY}
    CORS_ORIGINS: https://${APP_DOMAIN:?Define APP_DOMAIN}
    GOOGLE_VISION_ENABLED: ${GOOGLE_VISION_ENABLED:-true}
    GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Define GOOGLE_CLOUD_PROJECT}
    GOOGLE_VISION_LANGUAGE_HINTS: ${GOOGLE_VISION_LANGUAGE_HINTS:-}
  logging: *logs

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - database:/var/opt/mssql
      - backups:/var/opt/mssql/backup
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logs

  db-init:
    <<: *backend
    command: [python, BD/inicializar_demo.py]
    environment:
      <<: *backend-env
      SEED_DEMO: "true"
    depends_on:
      database:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./FrontEnd
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *logs

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging: *logs

volumes:
  database:
  backups:
  caddy_data:
  caddy_config:

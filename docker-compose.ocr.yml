# Usar con: docker compose -f docker-compose.yml -f docker-compose.ocr.yml up -d --build
services:
  backend:
    environment:
      GOOGLE_VISION_ENABLED: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json
    volumes:
      - type: bind
        source: ${GOOGLE_VISION_CREDENTIALS_FILE:?Define la ruta absoluta de las credenciales en el .env de Compose}
        target: /run/secrets/google-vision.json
        read_only: true

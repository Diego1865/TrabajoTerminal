# Solo para pruebas locales (deploy/verify-local.ps1): agrega SQL Server en un contenedor
# en lugar de Cloud SQL. En la VM NO se usa. Combinar después de compose.demo.yml:
#   docker compose -f compose.demo.yml -f deploy/compose.sqlserver-local.yml ...
# con DB_SERVER=database y DB_USER=sa en el entorno.
services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-init:
    depends_on:
      database:
        condition: service_healthy

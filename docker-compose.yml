services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Database
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    # Comparte el inicializador de la VM: crea TT y aplica las migraciones pendientes.
    command: ["python", "BD/inicializar_demo.py"]
    environment:
      - DB_DRIVER=${DB_DRIVER}
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: BackEnd
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - DB_DRIVER=${DB_DRIVER}
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_VISION_ENABLED=true
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google-vision.json
      - GOOGLE_VISION_LANGUAGE_HINTS=${GOOGLE_VISION_LANGUAGE_HINTS:-es}
      # En local los códigos se imprimen en el log (docker logs BackEnd); con SMTP_USER y SMTP_PASSWORD se envían.
      - CORREO_MODO=${CORREO_MODO:-consola}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - type: bind
        source: ${GOOGLE_VISION_CREDENTIALS_FILE:?Define la ruta absoluta de las credenciales en el .env de Compose}
        target: /run/secrets/google-vision.json
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: FrontEnd
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mssql_data:

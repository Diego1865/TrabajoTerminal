services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Database
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./BackEnd/BD/esquemaBD.sql:/tmp/esquemaBD.sql
    entrypoint: >
      /bin/bash -c "
      echo 'Esperando que la BD esté disponible para ejecutar el script...'
      /opt/mssql-tools18/bin/sqlcmd -S database -U sa -P '${DB_PASSWORD}' -C -i /tmp/esquemaBD.sql -b
      echo 'Script ejecutado con éxito.'
      "

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: BackEnd
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      - DB_DRIVER=${DB_DRIVER}
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_VISION_ENABLED=${GOOGLE_VISION_ENABLED:-false}
      - GOOGLE_VISION_LANGUAGE_HINTS=${GOOGLE_VISION_LANGUAGE_HINTS:-}

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: FrontEnd
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mssql_data:
